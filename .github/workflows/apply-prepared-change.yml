name: Apply prepared repository update

on:
  push:
    paths:
      - prepared-change.patch.gz.part-02

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified local change
        shell: bash
        run: |
          cat prepared-change.patch.gz.part-* | gzip -dc > /tmp/prepared-change.patch
          git apply --index --binary /tmp/prepared-change.patch
          git rm prepared-change.patch.gz prepared-change.patch.gz.part-*
          git rm .github/workflows/apply-prepared-change.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean environment files and document gameplay"
          git push
